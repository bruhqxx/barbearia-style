
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento - Barbearia Style</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>BARBEARIA STYLE</h1>

        <nav>
            <a href="index.html">Início</a>
            <a href="servicos.html">Serviços</a>
            <a href="agendamento.html">Agendamento</a>
        </nav>
    </header>

    <main class="pagina-agendamento">

        <h2>ESCOLHA SEU CAMINHO</h2>

        <p class="descricao-servicos">
            Reserve seu momento e transforme seu estilo.
        </p>

        <form class="form-agendamento">

            <p>
                <label for="nome">Nome completo:</label>
                <input type="text" id="nome" name="nome"
                    placeholder="Digite seu nome" required>
            </p>

            <p>
                <label for="telefone">Telefone:</label>
                <input type="tel" id="telefone" name="telefone"
                    placeholder="(00) 00000-0000" required>
            </p>

            <p>
                <label for="servico">Escolha seu serviço:</label>
                <select id="servico" name="servico" required>
                    <option value="">Selecione uma técnica</option>
                    <option value="Corte Tradicional">Respiração da Água - Corte Tradicional</option>
                    <option value="Corte e Barba">Respiração das Chamas - Corte + Barba</option>
                    <option value="Acabamento">Respiração do Trovão - Acabamento</option>
                    <option value="Barba">Respiração da Névoa - Barba</option>
                </select>
            </p>

            <p>
                <label for="data">Data:</label>
                <input type="date" id="data" name="data" required>
            </p>

            <p>
                <label for="horario">Horário:</label>
                <select id="horario" name="horario" required>
                    <option value="">Selecione um horário</option>
                    <option>09:00</option>
                    <option>10:00</option>
                    <option>11:00</option>
                    <option>13:00</option>
                    <option>14:00</option>
                    <option>15:00</option>
                    <option>16:00</option>
                    <option>17:00</option>
                </select>
            </p>

            <button type="submit">CONFIRMAR AGENDAMENTO</button>

        </form>

    </main>

</body>
</html>
